$kind: http-request
description: "Creates a new book. Expected: HTTP 201"
url: http://localhost:3000/books
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "JavaScript Basics",
      "author": "John",
      "price": 450,
      "pages": 250
    }
order: 1000
